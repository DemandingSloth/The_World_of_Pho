name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_TAG: "4.7.2-stable"
  GODOT_TEMPLATE_DIR: "4.7.2.stable"

jobs:
  export-windows-and-web:
    name: Export Windows & Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Godot ${{ env.GODOT_TAG }} (standard) & templates
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_TAG}_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          rm godot.zip

          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}"
          unzip -q templates.tpz -d templates_tmp
          mv templates_tmp/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}/"
          rm -rf templates.tpz templates_tmp

      - name: Import project resources
        run: godot --headless --import

      - name: Export Windows Desktop
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/World_of_Pho.exe
          ls -la build/windows

      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          cd build/web && zip -r ../../World_of_Pho-web.zip .

      - name: Upload Windows & Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-and-web-builds
          if-no-files-found: error
          path: |
            build/windows/*.exe
            World_of_Pho-web.zip

  export-android:
    name: Export Android (APK & AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
          fi

      - name: Install Godot ${{ env.GODOT_TAG }} (standard) & templates
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_TAG}_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          rm godot.zip

          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}"
          unzip -q templates.tpz -d templates_tmp
          mv templates_tmp/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}/"
          rm -rf templates.tpz templates_tmp

      - name: Install Android Gradle build template
        run: |
          mkdir -p android/build
          unzip -oq "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}/android_source.zip" -d android/build

      - name: Configure Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_USER: ${{ secrets.SIGNING_KEY_ALIAS || secrets.ANDROID_KEYSTORE_USER }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || secrets.SIGNING_STORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore/release.keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/keystore/release.keystore" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEYSTORE_USER" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set; generating a temporary debug keystore for signing."
            keytool -genkey -v -keystore "$RUNNER_TEMP/keystore/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/keystore/debug.keystore" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android" >> "$GITHUB_ENV"
          fi

      - name: Import project resources
        run: godot --headless --import

      - name: Export Android APK
        run: |
          mkdir -p build/android
          godot --headless --export-release "Android" build/android/The_World_of_Pho.apk

      - name: Export Android AAB
        run: |
          mkdir -p build/android
          godot --headless --export-release "Android 2" build/android/The_World_of_Pho.aab

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          if-no-files-found: error
          path: |
            build/android/The_World_of_Pho.apk
            build/android/The_World_of_Pho.aab

  release:
    name: Create GitHub Release
    needs: [export-windows-and-web, export-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows & Web artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-and-web-builds
          path: release-assets

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-builds
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
